[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oenb"
version = "0.1.0"
description = "Tools for the data web service of the Oesterreichische Nationalbank (OeNB)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Franz X. Mohr" }]
maintainers = [{ name = "Franz X. Mohr" }]
keywords = ["OeNB", "Austria", "central bank", "statistics", "economics", "time series", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "pandas>=1.3",
  "requests>=2.25",
]

[project.optional-dependencies]
test = ["pytest>=7", "responses>=0.23"]
dev = ["oenb[test]", "mypy>=1.8", "ruff>=0.4", "pandas-stubs", "types-requests"]

[project.urls]
Homepage = "https://github.com/franzmohr/oenb-py"
Source = "https://github.com/franzmohr/oenb-py"
Issues = "https://github.com/franzmohr/oenb-py/issues"
"OeNB web service" = "https://www.oenb.at/en/Statistics/User-Defined-Tables/webservice.html"
"R package" = "https://github.com/franzmohr/oenb"

[tool.hatch.build.targets.wheel]
packages = ["src/oenb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: tests that contact the OeNB web service (deselected by default)"]
addopts = "-m 'not live' --strict-markers"
filterwarnings = ["error::oenb.NoResultsWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unused_ignores = false
